name: Deploy Unite Recognition Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-control/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-control

      - name: Type-check
        run: npm run lint
        working-directory: apps/web-control

      - name: Validate public Supabase build variables
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SOURCE_SHEET_ID: ${{ vars.VITE_SOURCE_SHEET_ID }}
        shell: bash
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_SOURCE_SHEET_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing repository variable::$name is not configured in Settings > Secrets and variables > Actions > Variables."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error title=Invalid repository variable::VITE_SUPABASE_URL must be an https://*.supabase.co project URL."
              exit 1
              ;;
          esac

      - name: Build web demo
        run: npm run build
        working-directory: apps/web-control
        env:
          # These are public client values and will be embedded in the Vite bundle.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SOURCE_SHEET_ID: ${{ vars.VITE_SOURCE_SHEET_ID }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web-control/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
